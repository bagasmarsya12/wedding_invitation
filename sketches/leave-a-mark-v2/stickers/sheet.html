<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<title>Sticker kucing — sheet</title>
<style>
  body{margin:0;font-family:"Avenir Next",Avenir,"Helvetica Neue",Arial,sans-serif;background:#ece7de;color:#2b2925;
       padding:34px 0 46px;display:flex;flex-direction:column;align-items:center}
  h1{font-family:Baskerville,"Iowan Old Style","Palatino Linotype",Palatino,serif;font-size:1.5rem;font-weight:500;margin:0 0 6px}
  p.sub{font-size:.85rem;color:#6b6459;margin:0 0 24px}
  .grid{display:grid;grid-template-columns:repeat(3,190px);gap:26px 24px}
  .cell{display:flex;flex-direction:column;align-items:center;gap:10px;background:#f7f2e8;border-radius:14px;padding:18px 10px 12px}
  .cell img{width:150px;height:150px}
  .cell b{font-size:.78rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#5f584e}
  .smallrow{display:flex;gap:18px;margin-top:26px;align-items:center}
  .smallrow img{width:48px;height:48px}
  .smallrow span{font-size:.78rem;color:#6b6459;margin-left:6px}
</style>
</head>
<body>
  <h1>Sticker kucing — 6 ekspresi</h1>
  <p class="sub">Line-art selaras palet situs (charcoal · blush · krem). SVG transparan — berlaku untuk semua gaya kartu.</p>
  <div class="grid">
    <div class="cell"><img src="cat-01-senang.svg" alt="" /><b>Senang</b></div>
    <div class="cell"><img src="cat-02-ketawa.svg" alt="" /><b>Ketawa</b></div>
    <div class="cell"><img src="cat-03-love.svg" alt="" /><b>Love</b></div>
    <div class="cell"><img src="cat-04-malu.svg" alt="" /><b>Malu</b></div>
    <div class="cell"><img src="cat-05-kaget.svg" alt="" /><b>Kaget</b></div>
    <div class="cell"><img src="cat-06-ngantuk.svg" alt="" /><b>Ngantuk</b></div>
  </div>
  <div class="smallrow">
    <img src="cat-01-senang.svg" alt="" /><img src="cat-02-ketawa.svg" alt="" /><img src="cat-03-love.svg" alt="" />
    <img src="cat-04-malu.svg" alt="" /><img src="cat-05-kaget.svg" alt="" /><img src="cat-06-ngantuk.svg" alt="" />
    <span>ukuran di tray (48px)</span>
  </div>
</body>
</html>
